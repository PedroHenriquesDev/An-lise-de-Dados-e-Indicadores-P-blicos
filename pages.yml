name: Gerar artigo e publicar no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Executar testes automatizados
        run: python -m pytest -q

      - name: Baixar bases oficiais da PRF (2019–2025)
        run: python -m src.download --anos 2019 2020 2021 2022 2023 2024 2025

      - name: Processar acidentes do Rio de Janeiro
        run: python -m src.etl --input data/raw --uf RJ

      - name: Gerar artigo HTML e visualizações
        run: python -m src.build_article

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
